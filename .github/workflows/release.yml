name: Auto Technical Atlas - Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Show generated APK files
        run: |
          echo "=== APK OUTPUT DIRECTORY ==="
          find app/build/outputs/apk -type f -name "*.apk" -print
          echo "============================"

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*versionName *= *"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "Не удалось определить versionName"
            exit 1
          fi

          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ОШИБКА: APK не найден."
            echo "Содержимое outputs:"
            find app/build/outputs -type f -print || true
            exit 1
          fi

          echo "Найден APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        shell: bash
        run: |
          cp "${{ steps.apk.outputs.path }}" \
             "AutoTechnicalAtlas-v${{ steps.version.outputs.version }}.apk"

      - name: Verify final APK
        shell: bash
        run: |
          FILE="AutoTechnicalAtlas-v${{ steps.version.outputs.version }}.apk"

          if [ ! -f "$FILE" ]; then
            echo "ОШИБКА: итоговый APK не создан."
            exit 1
          fi

          echo "Итоговый APK:"
          ls -lh "$FILE"
          file "$FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoTechnicalAtlas-Release
          path: AutoTechnicalAtlas-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: Auto Technical Atlas v${{ steps.version.outputs.version }} Build ${{ github.run_number }}
          generate_release_notes: true
          files: AutoTechnicalAtlas-v${{ steps.version.outputs.version }}.apk
